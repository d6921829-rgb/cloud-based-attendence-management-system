{% extends "base.html" %}{% block title %}Student Registration{% endblock %}{% block content %}
<div class="form-wrap"><h2>Student registration</h2><p class="muted">Create your student account.</p>
<form method="post"><label>Full name</label><input name="name" required placeholder="Your full name">
<label>Roll number</label><input name="roll_no" required placeholder="e.g. 22AIDS001">
<label>Email address</label><input type="email" name="email" required placeholder="you@example.com">
<label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters">
<button class="btn full">Create account</button></form><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
